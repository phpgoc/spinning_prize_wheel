[package]
name = "spinning-prize-wheel"
version = "0.1.0"
description = "A local prize wheel and batch draw laboratory"
authors = ["phpgoc"]
edition = "2021"

[lib]
name = "spinning_prize_wheel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# bundled 会把 SQLite 源码编译并静态链接进桌面程序，不需要 sqlite3.dll。
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
